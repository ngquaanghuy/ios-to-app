name: Convert IPA to Simulator APP (iOS 27)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Nhập tên Tag của Release (ví dụ: v1.0)'
        required: true
        default: 'v1.0'

jobs:
  convert:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Download IPA from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading IPA from release ${{ github.event.inputs.release_tag }}..."
          gh release download "${{ github.event.inputs.release_tag }}" --repo "${{ github.repository }}" --pattern "*.ipa" -O app.ipa
          ls -lh app.ipa

      - name: Extract and Convert IPA to APP
        run: |
          unzip -q app.ipa -d extracted
          APP_PATH=$(find extracted/Payload -name "*.app" -maxdepth 1)
          PLIST_PATH="$PWD/$APP_PATH/Info.plist"
          EXEC_NAME=$(defaults read "$PLIST_PATH" CFBundleExecutable)
          
          echo "1. Updating Info.plist for iOS 27.0 Simulator..."
          /usr/libexec/PlistBuddy -c "Set :CFBundleSupportedPlatforms:0 iPhoneSimulator" "$PLIST_PATH" || true
          /usr/libexec/PlistBuddy -c "Set :DTPlatformName iphonesimulator" "$PLIST_PATH" || true
          /usr/libexec/PlistBuddy -c "Set :DTSDKName iphonesimulator27.0" "$PLIST_PATH" || true
          /usr/libexec/PlistBuddy -c "Delete :UIRequiredDeviceCapabilities" "$PLIST_PATH" || true

          echo "2. Converting executable: $EXEC_NAME to iOS 27.0 Simulator"
          vtool -set-build-version 7 27.0 27.0 -replace -output "$APP_PATH/$EXEC_NAME" "$APP_PATH/$EXEC_NAME"
          
          # Chuyển đổi toàn bộ thư viện dylib và framework đi kèm sang iOS 27.0 Simulator
          find "$APP_PATH" \( -name "*.dylib" -o -path "*.framework/*" \) -type f | while read -r file; do
            if file "$file" | grep -q "Mach-O"; then
              vtool -set-build-version 7 27.0 27.0 -replace -output "$file" "$file" || true
            fi
          done

          echo "3. Re-signing APP..."
          codesign --force --deep --sign - "$APP_PATH"
          
          mkdir output
          mv "$APP_PATH" output/
          cd output && zip -r -q ../SimulatorApp.zip *.app

      - name: Upload Converted APP
        uses: actions/upload-artifact@v4
        with:
          name: SimulatorApp
          path: SimulatorApp.zip
