name: Convert IPA to Simulator APP

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and Convert IPA to APP
        run: |
          unzip -q app.ipa -d extracted
          APP_PATH=$(find extracted/Payload -name "*.app" -maxdepth 1)
          PLIST_PATH="$PWD/$APP_PATH/Info.plist"
          EXEC_NAME=$(defaults read "$PLIST_PATH" CFBundleExecutable)
          
          echo "1. Updating Info.plist for Simulator..."
          /usr/libexec/PlistBuddy -c "Set :CFBundleSupportedPlatforms:0 iPhoneSimulator" "$PLIST_PATH" || true
          /usr/libexec/PlistBuddy -c "Set :DTPlatformName iphonesimulator" "$PLIST_PATH" || true
          /usr/libexec/PlistBuddy -c "Set :DTSDKName iphonesimulator18.5" "$PLIST_PATH" || true
          /usr/libexec/PlistBuddy -c "Delete :UIRequiredDeviceCapabilities" "$PLIST_PATH" || true

          echo "2. Converting executable: $EXEC_NAME"
          vtool -set-build-version 7 18.5 18.5 -replace -output "$APP_PATH/$EXEC_NAME" "$APP_PATH/$EXEC_NAME"
          
          find "$APP_PATH" \( -name "*.dylib" -o -path "*.framework/*" \) -type f | while read -r file; do
            if file "$file" | grep -q "Mach-O"; then
              vtool -set-build-version 7 18.5 18.5 -replace -output "$file" "$file" || true
            fi
          done

          echo "3. Re-signing APP..."
          codesign --force --deep --sign - "$APP_PATH"
          
          mkdir output
          mv "$APP_PATH" output/
          cd output && zip -r -q ../SimulatorApp.zip *.app

      - name: Upload Converted APP
        uses: actions/upload-artifact@v4
        with:
          name: SimulatorApp
          path: SimulatorApp.zip

